# Builds Linux (.deb + binary) and Windows (.exe) and attaches them to a GitHub Release.
# Trigger: push a tag such as v1.0.0  (git tag -a v1.0.0 -m "Mailpilot 1.0.0" && git push origin v1.0.0)
# Also runnable by hand from the Actions tab (builds and uploads artifacts, no release).
# Check the action versions below before relying on this file.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tk libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -c "import tkinter; print('tk', tkinter.TkVersion)"
      - name: Tag must match APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(python -c "import sys; sys.path.insert(0,'src'); from mailpilot.meta import APP_VERSION as v; print(v)")
          test "v$V" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match APP_VERSION v$V"; exit 1; }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest -v
      - run: python scripts/build.py
      - run: bash packaging/build_deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "dist/release/*" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest -v
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/release/*" }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
