# Mailpilot release pipeline
#
#   git tag -a v1.0.0 -m "Mailpilot 1.0.0" && git push origin v1.0.0
#
# builds   : Linux binary + .deb, Windows .exe
# publishes: a GitHub Release with those files + SHA256SUMS.txt
#            and (if the signing secret exists) the signed APT repository on the gh-pages branch
# Manual run (Actions tab > release > Run workflow) builds and keeps the files as artifacts only.
# Check the action versions below against their current releases before relying on this file.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tk libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -c "import tkinter; print('tk', tkinter.TkVersion)"
      - name: Tag must match APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(python -c "import sys; sys.path.insert(0,'src'); from mailpilot.meta import APP_VERSION as v; print(v)")
          test "v$V" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match APP_VERSION v$V"; exit 1; }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest -v
      - run: python scripts/build.py
      - name: Self-test the built binary
        run: ./dist/mailpilot --selftest
      - run: bash packaging/build_deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "dist/release/*" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest -v
      - run: python scripts/build.py
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\mailpilot.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "mailpilot.exe self-test failed (exit code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/release/*" }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release, merge-multiple: true }
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Install
            * **Windows:** download `mailpilot-*-windows-x86_64.exe` and run it (unsigned: SmartScreen may warn).
            * **Debian / Ubuntu (APT, updates automatically):** see https://iqbalsound.github.io/mailpilot/
            * **Debian / Ubuntu (single file):** `sudo apt install ./mailpilot_*_amd64.deb`
            * **Other Linux:** download `mailpilot-*-linux-x86_64`, then `chmod +x` it and run it.
            * Verify downloads with `sha256sum -c SHA256SUMS.txt`.

  apt:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux]
    runs-on: ubuntu-latest
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Is APT signing configured?
        id: chk
        run: |
          if [ -n "$APT_GPG_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secret APT_GPG_PRIVATE_KEY is not set: skipping the APT repository (the Release is unaffected)."
          fi
      - if: steps.chk.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with: { name: linux, path: release }
      - if: steps.chk.outputs.ok == 'true'
        name: Import the signing key
        run: |
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          test -n "$FPR" || { echo "No secret key was imported"; exit 1; }
          echo "APT_KEY=$FPR" >> "$GITHUB_ENV"
      - if: steps.chk.outputs.ok == 'true'
        name: Publish to the gh-pages branch
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name  "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/apt_publish.sh release/*.deb
